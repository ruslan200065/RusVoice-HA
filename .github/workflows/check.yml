name: Validate RusVoice
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pyyaml
      - run: python -m compileall -q rusvoice/app
      - run: python -m pytest -q tests
      - run: python -c "import yaml; a=yaml.safe_load(open('rusvoice/config.yaml')); assert a['slug']=='rusvoice'; assert 'amd64' in a['arch']"
      - name: Build add-on Docker image (amd64)
        run: docker build -t rusvoice-ha:ci ./rusvoice
